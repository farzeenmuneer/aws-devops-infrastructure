
# AWS Production Infrastructure - GitHub Actions CI

name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile app/app.py
          echo "Python syntax validation passed"

      - name: Validate Bash syntax
        run: |
          bash -n automation-scripts/system_health.sh || echo "Bash validation skipped (file not in this project)"
        continue-on-error: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform format check
        working-directory: ./terraform
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform init
        working-directory: ./terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ./terraform
        run: terraform validate

      - name: Build Docker image
        run: |
          docker build -t aws-production-infrastructure/prod-app:test ./app

      - name: Verify Docker image
        run: |
          docker images | grep aws-production-infrastructure

      - name: Build summary
        run: |
          echo "================================"
          echo "CI Pipeline completed successfully"
          echo "================================"